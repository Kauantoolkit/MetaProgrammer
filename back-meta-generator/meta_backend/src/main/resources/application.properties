spring.application.name=meta_backend

# CORS - em produção, defina a origem correta (ex: https://meuapp.com)
cors.allowed-origins=http://localhost:5173

# IA - Geração de funcionalidades
# Para usar: defina llm.enabled=true e configure o modelo/URL abaixo
llm.enabled=true
llm.mode=ollama
llm.url=http://localhost:11434
llm.model=qwen2.5-coder:latest
llm.api-key=
llm.timeout-seconds=120
